<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="./main.js"></script>
    <title>Weather App</title>
  </head>
  <body>
    <header>
      <div class="head">
        <div class="logo">
          <img src="./images/logo.svg" alt="logo" class="logo" />
        </div>
        <div class="unit-container">
          <div class="drop-down-cont">
            <img src="./images/icon-units.svg" alt="units" class="icon" />
            <p>Units</p>
            <img src="./images/icon-dropdown.svg" alt="dropdown" />
          </div>

          <div class="units">
            <button class="unit-button">Switch to Imperial</button>
            <h5>Temperature</h5>
            <p class="temp-cels">Celsius (°C) <span>✔</span></p>
            <p class="temp-fah">Fahrenheit (°F) <span>✔</span></p>
            <hr />
            <h5>Wind Speed</h5>
            <p class="speed-km">Km/h <span>✔</span></p>
            <p class="speed-m">mph<span>✔</span></p>
            <hr />
            <h5>Precipitation</h5>
            <p class="precip-mil">Millimeters (mm) <span>✔</span></p>
            <p class="precip-inch">Inches (in) <span>✔</span></p>
          </div>
        </div>
      </div>
    </header>
    <main>
      <section class="section1">
        <div>
          <h1 class="section1-text">How's the sky looking today?</h1>
        </div>
        <!-- search bar -->
        <div class="main-search">
          <div class="search">
            <img
              src="./images/icon-search.svg"
              alt="search"
              class="search-icon"
            />
            <input
              type="search"
              placeholder="Search for a place..."
              class="search-input"
            />
          </div>
          <div class="search-suggestions"></div>
          <button type="submit" class="submit-search">Search</button>
        </div>
      </section>
      <section class="desktop-flex">
        <div>
          <div class="result">
            <div class="wrap-first-result">
              <!-- BACKGROUND -->
              <div class="first-result">
                <!-- <div class="background-words">
                  <p class="country">Berlin, Germany</p>
                  <p class="day">Tuesday, Aug 5 2026</p>
                </div>
                <div class="background-icon">
                  <img
                    src="./images/icon-rain.webp"
                    alt=""
                    width="60"
                    height="60"
                    class="surface-image"
                  />
                  <p class="background-temp">20°</p>
                </div> -->
              </div>
            </div>

            <!-- AFTER BACKGROUND -->
            <div class="second-result"></div>
          </div>
          <div>
            <h2>Daily Forecast</h2>
            <div class="daily-forcast"></div>
          </div>
        </div>
        <div class="fourth-result-wrapper">
          <div class="hourly">
            <h2>Hourly Forecast</h2>
            <div class="hourly-day">
              <div class="selected-container">
                <div class="selected-day">
                  <p>Monday</p>
                </div>
                <img src="./images/icon-dropdown.svg" alt="" />
              </div>
              <ul class="hourly-day-days">
                <li>Monday</li>
                <li>Tuesday</li>
                <li>Wednesday</li>
                <li>Thursday</li>
                <li>Friday</li>
                <li>Saturday</li>
                <li>Sunday</li>
              </ul>
            </div>
          </div>
          <div class="hourly-grid"></div>
        </div>
      </section>
    </main>
  </body>
</html>
